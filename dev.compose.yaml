services:
    sight:
        container_name: sight
        working_dir: /app
        env_file:
            - env.example
        build:
            context: .
            dockerfile: "./dev.Dockerfile"
        tty: true
        cpu_count: 1
        ports:
            - 9235:9235
        volumes:
            - ./:/app/
        depends_on:
            - jaeger

    jaeger:
        image: jaegertracing/jaeger:2.3.0
        environment:
            COLLECTOR_OTLP_ENABLED: true
            COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
        ports:
            - "16686:16686"
            - "14268:14268"
            - "4317:4317"
            - "4318:4318"
            - "9411:9411"

    index:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
        expose:
            - "9200"
        ports:
            - 9200:9200
        container_name: index
        environment:
            - node.name=index
            - cluster.name=opensanctions-index
            - discovery.type=single-node
            - bootstrap.memory_lock=true
            - xpack.security.enabled=false
            - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - index-os-data:/usr/share/elasticsearch/data
        deploy:
            placement:
                max_replicas_per_node: 1
            restart_policy:
                condition: on-failure

    app:
        image: ghcr.io/opensanctions/yente:4.4.0
        depends_on:
            - index
        ports:
            - 8000:8000
        environment:
            YENTE_INDEX_TYPE: "elasticsearch"
            YENTE_INDEX_URL: http://index:9200
            # Set this to a randomly generated string to enable the /updatez API:
            YENTE_UPDATE_TOKEN: ""
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 3s
        deploy:
            mode: replicated
            # Run multiple instances for better scale:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 10s
                max_attempts: 3
                window: 120s

    prometheus:
        image: prom/prometheus
        ports:
            - "9090:9090"

volumes:
    index-os-data: null
