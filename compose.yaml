services:
  sight:
    container_name: sight
    working_dir: /app
    env_file:
      - env.example
    build:
      context: .
      dockerfile: "./dev.Dockerfile"
    tty: true
    cpu_count: 1
    ports:
      - 9235:9235
    volumes:
      - ./:/app/
    depends_on:
      - jaeger
    networks:
      - sight

  jaeger:
    image: jaegertracing/jaeger:2.3.0
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    networks:
      - sight

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    networks:
      - sight

networks:
  sight:
    driver: bridge
